name: Daily ETF Data Pipeline

on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 下載專案代碼 (Checkout repository)
        uses: actions/checkout@v4

      - name: 設定 Python 環境 (Setup Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安裝所需套件 (Install dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 初始化資料庫並寫入全量持股 (Init DB & Holdings)
        run: |
          mkdir -p data
          python db_manager.py
          python update_holdings.py

      - name: 執行每日盤後市場寬度計算 (Run Daily Batch)
        run: |
          python daily_batch.py

      - name: 自動提交更新後的資料庫 (Commit & Push DB)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f data/etf_system.db
          git diff-index --quiet HEAD || git commit -m "自動更新: 官方成分股與盤後市場寬度 [$(date +'%Y-%m-%d')]"
          git push
