name: Daily ETF Data Pipeline

on:
  schedule:
    # 平日盤後計算 (星期一至五 UTC 21:30)
    - cron: '30 21 * * 1-5'
    # 每月 1 號發起發行商官網連線檢查 (每月 1 號 UTC 01:00)
    - cron: '0 1 1 * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 下載專案代碼 (Checkout repository)
        uses: actions/checkout@v4

      - name: 設定 Python 環境 (Setup Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安裝所需套件 (Install dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 載入發行商官方核定全量持股 (Load Official Benchmark Holdings)
        run: |
          mkdir -p data
          python db_manager.py
          python update_holdings.py

      - name: 執行每日盤後市場寬度計算 (Run Daily Batch)
        run: |
          python daily_batch.py

      - name: 自動提交更新後的資料庫 (Commit & Push DB)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f data/etf_system.db
          git diff-index --quiet HEAD || git commit -m "自動更新: 官方核定持股與盤後市場寬度 [$(date +'%Y-%m-%d')]"
          git push
