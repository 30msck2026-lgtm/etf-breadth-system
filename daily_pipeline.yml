name: Daily ETF Data Pipeline

on:
  schedule:
    # 1. 每日排程: 星期一至五 UTC 21:30 (美股盤後) 自動計算市場寬度
    - cron: '30 21 * * 1-5'
    # 2. 每月排程: 每月 1 號 UTC 01:00 自動聯動發行商公開端點核實成分股更新
    - cron: '0 1 1 * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 下載專案代碼 (Checkout repository)
        uses: actions/checkout@v4

      - name: 設定 Python 環境 (Setup Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安裝所需套件 (Install dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行官方持股同步與月度校驗 (Sync Official Holdings)
        run: |
          mkdir -p data
          python db_manager.py
          # 每月 1 號自動觸發 --monthly-sync 參數，其餘日子使用高效官方底冊
          if [ "$(date +'%d')" = "01" ]; then
            python update_holdings.py --monthly-sync
          else
            python update_holdings.py
          fi

      - name: 執行每日盤後市場寬度計算 (Run Daily Batch)
        run: |
          python daily_batch.py

      - name: 自動提交更新後的資料庫 (Commit & Push DB)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f data/etf_system.db
          git diff-index --quiet HEAD || git commit -m "自動更新: 官方核定持股與盤後市場寬度 [$(date +'%Y-%m-%d')]"
          git push
